# Terragrunt Boilerplate Configuration
variables:
  # Generic Boilerplate Variables Setup
  - name: is_hub
    order: 0
    description: "Is this a hub configuration?"
    type: bool
    default: false
    confirm: true
  - name: tags
    order: 1
    description: "Tags"
    type: map
    default: {}
    confirm: true
  # End - Generic Boilerplate Variables Setup
  - name: artifact_bucket_dependency
    order: 2
    description: "Dependency reference for the artifact bucket module output."
    type: bool
    default: false
    confirm: true
  - name: artifact_bucket_path
    order: 3
    description: "Path to the artifact bucket module output in the dependency configuration."
    type: string
    default: "../bucket"
    confirm: true

hooks:
  after:
    - command: "git"
      args: ["add", "."]
      dir: "{{ outputFolder }}"