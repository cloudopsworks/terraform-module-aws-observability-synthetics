#              - type: "STATUS_CODE"              # (Required) Assertion type: STATUS_CODE | RESPONSE_TIME
#                operator: "EQUALS"               # (Required) Operator: EQUALS | NOT_EQUALS | GREATER_THAN | LESS_THAN
