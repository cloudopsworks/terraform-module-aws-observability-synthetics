  ### Generated `terragrunt.hcl`

  ```hcl
  locals {
    local_vars  = yamldecode(file("./inputs.yaml"))
    spoke_vars  = yamldecode(file(find_in_parent_folders("spoke-inputs.yaml")))
    region_vars = yamldecode(file(find_in_parent_folders("region-inputs.yaml")))
    env_vars    = yamldecode(file(find_in_parent_folders("env-inputs.yaml")))
    global_vars = yamldecode(file(find_in_parent_folders("global-inputs.yaml")))

    local_tags  = jsondecode(file("./local-tags.json"))
    spoke_tags  = jsondecode(file(find_in_parent_folders("spoke-tags.json")))
    region_tags = jsondecode(file(find_in_parent_folders("region-tags.json")))
    env_tags    = jsondecode(file(find_in_parent_folders("env-tags.json")))
    global_tags = jsondecode(file(find_in_parent_folders("global-tags.json")))

    tags = merge(
      local.global_tags,
      local.env_tags,
      local.region_tags,
      local.spoke_tags,
      local.local_tags
    )
  }

  include "root" {
    path = find_in_parent_folders("root.hcl")
  }

  terraform {
    source = "github.com/cloudopsworks/terraform-module-aws-observability-synthetics//.?ref=<TAG>"
  }

  inputs = {
    is_hub    = false
    org       = local.env_vars.org
    spoke_def = local.spoke_vars.spoke
    vpc                    = local.local_vars.vpc
    groups                 = try(local.local_vars.groups, [])
    default_sns_topic_name = try(local.local_vars.default_sns_topic_name, "")
    create_alarms          = try(local.local_vars.create_alarms, true)
    alarms_defaults        = try(local.local_vars.alarms_defaults, {})
    request_scripts        = try(local.local_vars.request_scripts, [])
    canary_defaults        = try(local.local_vars.canary_defaults, {})
    artifact_output_prefix = try(local.local_vars.artifact_output_prefix, "")
    code_package_prefix    = try(local.local_vars.code_package_prefix, "upload/scripts")
    artifacts_bucket       = try(local.local_vars.artifacts_bucket, "")
    create_artifacts_bucket = try(local.local_vars.create_artifacts_bucket, false)
    extra_tags = local.tags
  }
  ```

  When scaffolding with `artifact_bucket_dependency=true`, a `dependency "artifact_bucket"` block is
  added and `artifacts_bucket` / `create_artifacts_bucket` are wired to the dependency outputs automatically.

# Example usage
examples: |-
  The following `inputs.yaml` example uses generic names and endpoints and can be applied
  from a directory produced by `terragrunt scaffold`:

  ```yaml
  vpc:
    enabled: true
    vpc_id: "vpc-00000000000000000"
    subnet_ids:
      - "subnet-00000000000000001"
      - "subnet-00000000000000002"
    security_group_ids:
      - "sg-00000000000000000"

  artifacts_bucket: "example-synthetics-artifacts"
  artifact_output_prefix: "synthetics/artifacts"
  code_package_prefix: "synthetics/packages"

  canary_defaults:
    artifact_config:
      s3_encryption:
        encryption_mode: "SSE_S3"
    run_config:
      ephemeral_storage_mb: 1024
    schedule_retry:
      max_retries: 1

  request_scripts:
    - name: "browser-script"
      runtime_version: "syn-nodejs-puppeteer-16.0"
      handler: "custom_handler.handler"
      content: |
        exports.handler = async () => {
          console.log("generic browser script");
          return true;
        };

  groups:
    - name: "external-checks"
      vpc:
        enabled: false
      canaries:
        - name: "home-page"
          requests_type: "BROWSER_SCRIPT"
          request_script_ref: "browser-script"

    - name: "private-api"
      vpc:
        enabled: true
      default_run_config:
        tracing: true
        timeout: 60
        memory_mb: 1024
      canaries:
        - name: "post-check"
          requests_type: "HTTP_API"
          requests:
            - url: "https://api.example.org/v1/check"
              method: "POST"
              headers:
                Content-Type: "application/json"
              body: "{\"request\":\"example\",\"secret\":\"REDACTED\"}"
              assertions:
                - type: "STATUS_CODE"
                  operator: "EQUALS"
                  value: 202
  ```

# How to get started quickly
quickstart: |-
  1. Prepare your AWS environment:
     - Ensure AWS credentials are configured
     - Identify target VPC, subnets, and security groups
     - Prepare SNS topics for alarm notifications (optional)

  2. Scaffold the deployment directory:
     ```bash
     mkdir -p production/us-east-1/main/synthetics
     cd production/us-east-1/main/synthetics
     terragrunt scaffold github.com/cloudopsworks/terraform-module-aws-observability-synthetics
     ```

  3. Edit `inputs.yaml` with your deployment values:
     ```yaml
     vpc:
       enabled: true
       vpc_id: "vpc-0abc123def456"
       subnet_ids:
         - "subnet-0abc123"
         - "subnet-0def456"

     artifacts_bucket: "example-synthetics-artifacts"
     artifact_output_prefix: "synthetics/artifacts"
     code_package_prefix: "synthetics/packages"

     groups:
       - name: "api-monitoring"
         canaries:
           - name: "api-health"
             requests_type: "HTTP_API"
             requests:
               - url: "https://api.example.com/health"
                 method: "GET"
                 assertions:
                   - type: "STATUS_CODE"
                     operator: "EQUALS"
                     value: 200

     create_alarms: true
     default_sns_topic_name: "monitoring-alerts"
     create_artifacts_bucket: false
     ```

  4. Apply configuration:
     ```bash
     terragrunt init
     terragrunt plan
     terragrunt apply
     ```

  5. Verify deployment:
     - Check AWS Synthetics console for canary status
     - Monitor CloudWatch metrics and alarms
     - Confirm SNS notifications are delivered

